[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-reasoning-fas"
version = "0.1.0"
description = "Difficulty-aware DQN for adaptive LLM reasoning termination, applied to financial advisory"
# 3.11 is the floor because src/adaptive_reasoning/schema.py uses enum.StrEnum, which
# was added in 3.11. This previously read ">=3.10" while the code needed 3.11, and CI
# caught the mismatch on the 3.10 matrix leg.
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
    "gpu: tests that require a CUDA device",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
