# The configuration every reported figure is produced with.
#
#     python scripts/run_phase5.py --experiment reported
#
# It matches configs/default.yaml. The file exists so the reported operating point is
# stated somewhere explicit and cannot drift if the default is edited - the figures in
# docs/FINDINGS.md and the review deck were once produced with an override nobody had
# written down, which cost an afternoon to reconstruct.
#
# How the best DQN checkpoint is chosen on validation decides the operating point, and
# the two available objectives put the policy in genuinely different places:
#
#   accuracy_at_budget  (used here) maximise accuracy subject to saving at least
#                       min_token_reduction percent. The budget is stated, so the
#                       matched-cost comparison against the baselines is meaningful.
#                       Lands at ~45% saved and 39.2% accuracy.
#
#   weighted_score      accuracy + 0.30 * token_reduction. The 0.30 is arbitrary and
#                       quietly decides how much accuracy a token is worth: at this
#                       weight the policy stops at step 0 on 54% of questions, where
#                       accuracy is 21%, and lands at ~65% saved and 33.7% accuracy.
#
# Both are real points on one frontier and neither is wrong, but a stated budget is
# defensible in a way an arbitrary weight is not. The aggressive point is reported in
# docs/FINDINGS.md as the cost-sensitive end of the frontier, not hidden.
rl:
  selection:
    objective: accuracy_at_budget
    min_token_reduction: 45.0
