# =============================================================================
# Difficulty-Aware Adaptive Reasoning - master configuration
#
# Every phase reads its settings from here. Override per experiment with
# `configs/experiment/<name>.yaml`, which is deep-merged over this file.
# =============================================================================

project:
  name: adaptive-reasoning-fas
  seed: 42
  # cpu | cuda | xpu | mps | auto
  device: auto

# -----------------------------------------------------------------------------
# Phase 1 - data pipeline
# -----------------------------------------------------------------------------
data:
  # Per-source caps. null = use everything available.
  sample_sizes:
    finqa: null          # ~8,281 - core numeric reasoning
    tatqa: 4000          # of 16,552
    convfinqa: 3000      # turn-level, train+dev only (test answers are withheld)
    phrasebank: null     # ~3,453 at 75% annotator agreement
    paysim: 5000         # balanced sample from 6.3M rows
    german_credit: null  # 1,000
    synthetic: 6000      # generated by us

  phrasebank_config: sentences_75agree

  # PaySim is 99.87% legitimate. Oversample fraud so the task is learnable
  # and the reward signal is not dominated by one class.
  paysim_fraud_ratio: 0.35

  splits:
    train: 0.70
    val: 0.15
    test: 0.15
    stratify_by: [domain, difficulty]

  # Numeric answers count as correct within this relative tolerance.
  # FinQA convention is 1%; we keep it explicit because the RL reward depends on it.
  numeric_tolerance: 0.01

  # Prompt context is truncated to this many characters. FinQA/TAT-QA reports run to
  # tens of thousands of characters; long prompts slow Phase 3 down without making the
  # reasoning question any harder.
  max_context_chars: 2500

  # FinQA and ConvFinQA ship annotated gold evidence rows. Using them ("oracle
  # retrieval") isolates the research question - reasoning length - from retrieval
  # quality, and shortens prompts dramatically. Set false to use the full report.
  use_gold_evidence: true

  # Drop protected attributes (sex, foreign-worker status) when templating the
  # German Credit records into questions. See docs/DATASETS.md.
  exclude_protected_attributes: true

# -----------------------------------------------------------------------------
# Phase 2 - difficulty labelling and classifier
# -----------------------------------------------------------------------------
difficulty:
  # Number of independent LLM samples per question used to derive the label.
  # 3 rather than 5 on the remote run: 0/3, 1/3, 2/3, 3/3 still separates three tiers
  # at 40% less GPU time. See docs/PHASE3_REMOTE.md.
  k_samples: 5
  sampling_temperature: 0.7

  # Token cap for difficulty sampling. Lower than the full reasoning budget because we
  # only need to know whether the model gets there, not to observe the whole trace.
  sample_max_new_tokens: 512

  # How many questions to sample. null = every question in the unified dataset.
  # Only the traced subset strictly needs a measured label; the classifier generalises
  # to the rest.
  n_questions: 8000

  # Label thresholds on the pass-rate over k samples.
  easy_min_pass_rate: 0.8    # >= 4/5 correct
  hard_max_pass_rate: 0.2    # <= 1/5 correct
  # Anything between the two is medium.

  # A question that is solved but only after a long think is bumped up a tier.
  long_reasoning_token_threshold: 400

  # --- Deriving difficulty from traces instead of separate k-sampling ------------
  # Measured on a Kaggle T4: sampling the model k times purely to measure difficulty
  # was ~71% of the total GPU cost. The traces generated in Phase 3 already carry the
  # same information, so labels are derived from them on CPU instead, for free.
  #
  # The primary signal becomes `correct_ratio`: the fraction of probe points along the
  # trace at which the answer was already correct. This is arguably a *better* measure
  # for a stopping policy than a k-sample pass rate, because it directly answers
  # "how early, and how consistently, does the model know this?" - which is exactly
  # the question the policy has to answer.
  # Thresholds calibrated against the observed distribution over 4,000 real traces
  # (45,853 probe points), not guessed. See docs/PHASE2_DIFFICULTY.md.
  from_traces:
    easy_min_correct_ratio: 0.50    # right early and held it
    hard_max_correct_ratio: 0.15    # right only at the very end, or never

    # The two rules below are *exception* rules and must stay rare. Both were
    # originally set at 0.60 and fired on 36% and 65% of questions respectively,
    # collapsing the medium tier to 7.5%. Measured percentiles over solvable traces:
    #   tokens/budget   p25 0.35  p50 0.50  p75 0.70
    #   change_ratio    p50 0.67  p75 0.79  p90 0.87  p95 0.89
    #
    # change_ratio is high everywhere because the tentative answer legitimately
    # evolves during reasoning - it is not evidence of guessing until it is extreme.
    # The length rule is also largely redundant: correct_ratio already encodes how
    # early the answer was found. Both now sit near the top of their distributions so
    # they catch genuine outliers only.
    long_reasoning_ratio: 0.90
    unstable_answer_ratio: 0.90

  classifier:
    encoder: sentence-transformers/all-MiniLM-L6-v2
    head: lightgbm          # lightgbm | logistic
    max_seq_length: 256
    # Characters of context prepended to the question before embedding. 0 embeds the
    # question alone. Measured on 4,000 labelled traces (500-question eval split):
    #   question only            acc 0.550  macroF1 0.435
    #   question + context       acc 0.584  macroF1 0.440
    #   context + question (512) acc 0.602  macroF1 0.486   <- chosen
    #   majority baseline        acc 0.538
    # For report-QA questions the table is where the difficulty lives, so the question
    # text alone is genuinely uninformative.
    context_chars: 512
    n_estimators: 400
    learning_rate: 0.05
    class_weight: balanced

# -----------------------------------------------------------------------------
# Phase 3 - reasoning LLM and trace generation
# -----------------------------------------------------------------------------
llm:
  model_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  # Larger option if a 24GB GPU is available:
  # model_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
  dtype: float16          # float16 on GPU, float32 on CPU
  load_in_4bit: false     # requires bitsandbytes + CUDA
  max_new_tokens: 1024    # hard ceiling on the reasoning budget
  temperature: 0.6
  top_p: 0.95
  batch_size: 8

traces:
  # How many unified-schema questions actually get traced. The rest stay as
  # held-out evaluation data. Trace generation is the only expensive step.
  n_questions: 6000

  # Reasoning is chopped into steps at these boundaries; a step ends at whichever
  # comes first.
  step_tokens: 32              # probe at least every N generated tokens
  step_delimiters: ["\n\n", ". ", "\nWait", "\nSo ", "\nTherefore"]
  max_steps: 32

  # At each step boundary we force an answer to see what we *would* have said.
  probe_prompt: "\n\nTherefore, the final answer is"
  probe_max_tokens: 24

  # Token-level statistics captured at every probe.
  capture:
    answer_confidence: true    # mean prob of the answer tokens
    min_token_confidence: true # weakest token in the answer
    entropy: true              # mean entropy over the last chunk
    top_k_logprobs: 5

  # Write partial results this often so a dropped Colab/Kaggle session is survivable.
  checkpoint_every: 100
  output_format: parquet

  # --- Pilot gate -----------------------------------------------------------
  # Phase 3 runs this pilot first and refuses to continue if it fails. Two things
  # are checked, both of which would invalidate the whole run if wrong:
  #
  #   1. Does the model actually reason at length? If it answers in 3 tokens there
  #      is nothing to stop early and the project has no signal. The 0.5B smoke
  #      model failed exactly this way.
  #   2. What is the real throughput? Every GPU-hour estimate in the docs is a
  #      guess until this measures it.
  pilot:
    n_questions: 50
    # Abort if the median reasoning length is below this. A genuine reasoning model
    # on financial questions should produce hundreds of tokens.
    min_median_reasoning_tokens: 64
    # Abort if fewer than this fraction of generations reach an answer at all.
    min_answer_rate: 0.7

# -----------------------------------------------------------------------------
# Phases 4-5 - offline RL environment and DQN
# -----------------------------------------------------------------------------
rl:
  # Where the three difficulty features in the state come from.
  #   predicted - the classifier's probabilities. This is what the live system sees, so
  #               training on it avoids a train/serve mismatch. The classifier is only
  #               ~60% accurate, and the policy should learn to cope with that rather
  #               than be handed a certainty it will not have.
  #   true      - measured labels as a one-hot. Ablation: an upper bound showing what a
  #               perfect difficulty predictor would be worth.
  #   none      - a flat 1/3 vector. Ablation: the core "is difficulty-awareness doing
  #               any work?" comparison.
  # Note the reward always uses the *measured* label - see rl/reward.py.
  difficulty_source: predicted

  state_features:
    - difficulty_easy
    - difficulty_medium
    - difficulty_hard
    - confidence
    - min_token_confidence
    - entropy
    - entropy_slope
    - token_ratio
    - step_index_norm
    - delta_confidence
    - answer_stability
    - progress_cue
    - doubt_cue
    - steps_since_answer_change
    # The shape of the answer string itself. A model part-way through emits a sentence
    # ("the net change between 2008 and...") and a finished one emits a value
    # ("407 million dollars"), so these say more about whether it is done than
    # confidence or entropy do - together they lift stop-correctness AUC 0.700 -> 0.767.
    - answer_length
    - answer_word_count
    - answer_is_value
    - answer_repeat_count

  reward:
    correct_bonus: 1.0        # alpha - reward for stopping on a correct answer
    incorrect_penalty: -1.0   # reward for stopping on a wrong answer
    # beta - per-token cost, scaled by predicted difficulty. This is the
    # "difficulty-aware" term and the core of the novelty claim.
    token_cost:
      easy: 0.60
      medium: 0.30
      hard: 0.12
    # Global multiplier on every token cost. Sweeping it traces the accuracy-versus-
    # cost frontier without touching the difficulty-aware *ratios* between tiers, which
    # is what a single-number result hides: a low multiplier buys accuracy with tokens,
    # a high one does the reverse. Phase 5 --sweep uses this.
    cost_multiplier: 1.0
    # Small extra nudge for stopping while the answer has been stable.
    stability_bonus: 0.05

  # How the best checkpoint is chosen on validation.
  #   weighted_score       - accuracy + w * token_reduction. Simple, but the weight is
  #                          arbitrary and quietly decides the operating point.
  #   accuracy_at_budget   - maximise accuracy subject to saving at least
  #                          min_token_reduction percent. States the operating point
  #                          explicitly, which is what makes a comparison against
  #                          another method at the same cost meaningful.
  selection:
    objective: accuracy_at_budget
    min_token_reduction: 45.0
    weight: 0.30

  dqn:
    hidden_sizes: [128, 128]
    gamma: 0.99
    learning_rate: 0.0005
    batch_size: 128
    buffer_size: 200000
    target_update_interval: 500
    train_steps: 60000
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 20000
    double_dqn: true
    grad_clip: 10.0
    eval_every: 2000

# -----------------------------------------------------------------------------
# Phase 6 - evaluation
# -----------------------------------------------------------------------------
eval:
  baselines:
    - full_reasoning        # no early stop, accuracy and cost ceiling
    - fixed_budget          # stop at a fixed token count
    - confidence_threshold  # stop when confidence > tau
    - entropy_threshold     # stop when entropy < tau
    - answer_stability      # stop when the answer repeats
    - random_stop           # sanity floor
    - oracle                # earliest correct stop, the achievable ceiling
    - dqn                   # ours

  fixed_budget_tokens: [128, 256, 512]
  confidence_tau: [0.80, 0.90, 0.95]
  entropy_tau: [0.20, 0.30, 0.50]

  metrics:
    - accuracy
    - avg_reasoning_tokens
    - token_reduction_pct
    - latency_p50
    - latency_p95
    - peak_memory_mb
    - energy_joules
  measure_energy: true        # requires pynvml on a CUDA device
  bootstrap_samples: 1000     # for confidence intervals on accuracy deltas

# -----------------------------------------------------------------------------
# Phases 7-8 - serving and application
# -----------------------------------------------------------------------------
serve:
  host: 127.0.0.1
  port: 8000
  stream: true
  # Safety net: stop regardless of what the policy says.
  hard_token_cap: 1024
  min_steps_before_stop: 1
  disclaimer: >
    This system provides automated financial analysis for informational purposes
    only. It is not personalised investment advice and does not come from a
    licensed financial adviser.

app:
  title: Adaptive Financial Advisory
  show_reasoning_trace: true
  show_savings_panel: true
  compare_against: full_reasoning

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: INFO
  to_file: true
  rich_console: true
